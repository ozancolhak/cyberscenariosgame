                        { id: 'd5_monitor', title: "Trafik Akışını İzle ve Doğrula", smallText: "Engelleme sonrası DNS ve diğer trafik loglarını izleyerek anormalliğin tamamen durduğunu teyit et.", strat: "Bir engelleme uyguladıktan sonra, işinin bittiğini varsayma. Her zaman doğrulama yap. Saldırganlar genellikle engellendiklerini anladıklarında alternatif yollar denerler.", changes: { financialImpact: 5000, networkPerformance: -1 }, impact: 'Positive' },
                        { id: 'd5_sinkhole', title: "DNS Sinkholing ile Tehdit İstihbaratı Topla", smallText: "Zararlı alan adını bloklamak yerine, trafiği bir analiz sunucusuna yönlendirerek saldırganın TTP'leri hakkında daha fazla bilgi topla.", strat: "DNS Sinkholing, reaktif savunmadan proaktif istihbarat toplamaya geçişin en ileri adımlarından biridir. Saldırgan hakkında bilgi toplamak, onu engellemek kadar değerlidir.", changes: { financialImpact: 20000, reputation: +5, dataIntegrity: +5 }, impact: 'Positive' },
                        { id: 'd5_isolate_host', title: "Sunucuyu Ağdan Tamamen İzole Et", smallText: "Riski sıfırlamak için etkilenen sunucuyu ağdan çek ve adli analiz için Olay Müdahale ekibine devret.", strat: "Tam izolasyon, en güvenli yok etme yöntemidir ancak iş sürekliliğine etkisi büyüktür. Risk ve fayda dengesi dikkatle değerlendirilmelidir.", changes: { financialImpact: 50000, networkPerformance: -20, dataIntegrity: +10 }, impact: 'Negative' }
                    ]
                },
                {
                    id: 'phase6_post_incident',
                    title: "Aşama 6: Olay Sonrası ve Raporlama",
                    description: "Tehdit tamamen kontrol altına alındı. Şimdi bu olayın neden yaşandığını raporlamak ve gelecekte benzer olayları önlemek için kalıcı adımlar önermek, bir mühendis olarak en önemli sorumluluklarınızdan biridir. Yönetim, bu olayın tekrar etmeyeceğinden emin olmak istiyor.",
                    image: "report.png",
                    maxChoices: 1,
                    decisions: [
                        { id: 'd6_report', title: "Kök Neden Analizi ve Raporlama", smallText: "Tüm bulguları, atılan adımları ve sonuçları içeren detaylı bir RCA raporu hazırlayıp yönetime sun.", strat: "İyi bir müdahale, iyi bir raporlama ile biter. Ne yaptığınızı, neden yaptığınızı ve sonuçlarını belgelemek, hem öğrenme süreci hem de kurumsal sorumluluk için esastır.", changes: { financialImpact: 1000, reputation: +5 }, impact: 'Positive' },
                        { id: 'd6_full_mitigation', title: "Kalıcı Çözüm ve Ağ Sertleştirme Önerileri", smallText: "Ağ genelinde DNS denetimini artıracak ve Egress Filtreleme kurallarını sıkılaştıracak bir proje öner.", strat: "Her kriz bir öğrenme fırsatıdır. Olay sonrası sadece yarayı sarmak değil, gelecekteki benzer olayları önleyecek kalıcı iyileştirmeler önermek, kıdemli bir mühendisin en önemli görevlerindendir.", changes: { financialImpact: 30000, dataIntegrity: +5, reputation: +2 }, impact: 'Positive' }
                    ]
                }
            ]
        };

        // =================================================================================
        // GAME ENGINE
        // This part runs the simulation based on the scenario data above.
        // =================================================================================
        const game = {
            score: {},
            state: {},
            elements: {},
            timer: {},

            init() {
                this.elements.appContainer = document.getElementById('app-container');
                
                scenarioData.metrics.forEach(m => {
                    this.score[m.id] = m.startValue;
                });

                this.state = {
                    currentPhaseIndex: 0,
                    decisionHistory: [],
                    currentTurnDecisions: [],
                    totalScore: null
                };
                
                this.timer = {
                    total: scenarioData.timer,
                    remaining: scenarioData.timer,
                    intervalId: null,
                    running: false
                };

                this.renderIntro();
            },

            render(html) {
                this.elements.appContainer.innerHTML = html;
            },

            renderIntro() {
                const rolesHtml = scenarioData.roles.map(r => `<li><span class="icon"><i class="fa-solid ${r.icon}"></i></span><div><strong>${r.name}</strong> <small>${r.desc}</small></div></li>`).join('');
                const metricsHtml = scenarioData.metrics.map(m => `<li><span class="icon" style="color: ${m.color};"><i class="fa-solid ${m.icon}"></i></span><div><strong>${m.name}</strong> <small>${m.desc} (Başlangıç: ${m.startValue}${m.unit})</small></div></li>`).join('');

                const introHtml = `
                    <div class="container">
                        <div id="introSection" class="centered-page">
                            <h1><i class="fa-solid ${scenarioData.icon}"></i> ${scenarioData.title}</h1>
                            <p style="max-width: 700px;">${scenarioData.introText}</p>
                            <img src="network.png" alt="Ağ trafiği analizi temalı bir görsel" class="scenario-image">
                            <div class="intro-info-grid">
                                <div class="intro-roles-container"><h3><i class="fa-solid fa-people-arrows"></i> Simülasyon Rolleri</h3><ul>${rolesHtml}</ul></div>
                                <div class="intro-metrics-container"><h3><i class="fa-solid fa-chart-line"></i> Temel Metrikler</h3><ul>${metricsHtml}</ul></div>
                            </div>
                            <button class="btn btn-start" id="startButton"><i class="fa-solid fa-play"></i> Simülasyonu Başlat</button>
                        </div>
                    </div>`;
                this.render(introHtml);
                document.getElementById('startButton').addEventListener('click', () => this.startGame());
            },

            startGame() {
                const statusBarMetricsHtml = scenarioData.metrics.map(m => `
                    <div class="metric">
                        <span><i class="fa-solid ${m.icon}"></i> ${m.name}</span>
                        <div class="value" id="status-${m.id}">${m.startValue}${m.unit === '₺' ? '₺' : ''}${m.startValue.toLocaleString('tr-TR')}${m.unit !== '₺' ? m.unit : ''}</div>
                    </div>`).join('');
                
                const gameHtml = `
                    <div class="container">
                        <div id="gameContainer">
                            <div id="statusBar">
                                ${statusBarMetricsHtml}
                                <div class="metric" id="status-timer">
                                    <span><i class="fa-solid fa-stopwatch"></i> Kalan Süre</span>
                                    <div class="value" id="status-remaining">--:--</div>
                                </div>
                            </div>
                            <div id="game-content"></div>
                        </div>
                        <div id="intermissionSection" class="centered-page" style="display: none;">
                            <h2 id="intermissionTitle"></h2>
                            <div id="intermissionDetails"></div>
                            <button class="btn btn-continue" id="continueButton" style="margin-top: 30px; display: none;"><i class="fa-solid fa-forward"></i> Devam Et</button>
                        </div>
                    </div>`;
                this.render(gameHtml);

                this.elements.statusBar = {};
                scenarioData.metrics.forEach(m => {
                    this.elements.statusBar[m.id] = document.getElementById(`status-${m.id}`);
                });
                this.elements.statusBar.remaining = document.getElementById('status-remaining');
                this.elements.gameContent = document.getElementById('game-content');
                
                this.startTimer();
                this.renderPhase(this.state.currentPhaseIndex);
            },

            renderPhase(phaseIndex) {
                const phase = scenarioData.phases[phaseIndex];
                if (!phase) {
                    this.renderFinalReport();
                    return;
                }

                const decisionsHtml = phase.decisions.map(d => {
                    const is_disabled = this.state[d.id] || false;
                    let dependencyMet = true;
                    let dependencyText = d.smallText;

                    if (d.id === 'd3_wireshark' && !this.state.d2_pcap) {
                        dependencyMet = false;
                        dependencyText = 'Önce paket yakalama (PCAP) işlemi başlatmalısınız.';
                    }

                    return `<button class="btn ${d.impact === 'Negative' ? 'critical' : ''}" data-decision-id="${d.id}" ${is_disabled || !dependencyMet ? 'disabled' : ''}>
                                <i class="fa-solid fa-chevron-right"></i>
                                <div class="btn-text">${d.title}<small>${dependencyText}</small></div>
                            </button>`;
                }).join('');

                const phaseHtml = `
                    <div class="section" style="display: block;" data-max-selections="${phase.maxChoices}">
                        <h2>${phase.title}</h2>
                        <p>${phase.description}</p>
                        ${phase.image ? `<img src="${phase.image}" alt="${phase.title}" class="scenario-image">` : ''}
                        <div class="interactive-element">
                            <h4>Ne yapacaksınız? (${phase.maxChoices} Seçim Yapın)</h4>
                            <div class="decision-buttons">${decisionsHtml}</div>
                        </div>
                    </div>`;
                this.elements.gameContent.innerHTML = phaseHtml;
                this.elements.gameContent.querySelector('.decision-buttons').addEventListener('click', (e) => {
                    const button = e.target.closest('.btn[data-decision-id]');
                    if (button && !button.disabled) {
                        this.handleDecision(button.dataset.decisionId);
                    }
                });
            },

            handleDecision(decisionId) {
                const phase = scenarioData.phases[this.state.currentPhaseIndex];
                const decision = phase.decisions.find(d => d.id === decisionId);

                if (!decision) return;

                document.querySelector(`[data-decision-id="${decisionId}"]`).disabled = true;
                this.state.currentTurnDecisions.push(decision);
                this.state[decision.id] = true;
                this.state.decisionHistory.push(decision);

                for (const key in decision.changes) {
                    if (this.score.hasOwnProperty(key)) {
                        this.score[key] += decision.changes[key];
                    }
                }
                this.updateStatusBar();

                if (this.state.currentTurnDecisions.length >= phase.maxChoices) {
                    this.renderIntermission();
                }
            },
            
            renderIntermission() {
                const decisionsMade = this.state.currentTurnDecisions;
                this.state.currentPhaseIndex++;
                const nextPhase = scenarioData.phases[this.state.currentPhaseIndex];
                
                document.getElementById('gameContainer').style.display = 'none';
                const intermissionSection = document.getElementById('intermissionSection');
                const titleEl = document.getElementById('intermissionTitle');
                const detailsEl = document.getElementById('intermissionDetails');
                const continueBtn = document.getElementById('continueButton');

                let totalChanges = {};
                scenarioData.metrics.forEach(m => totalChanges[m.id] = 0);
                
                let combinedTitles = [], combinedStrats = [];
                decisionsMade.forEach(d => {
                    for (const key in d.changes) { totalChanges[key] += d.changes[key]; }
                    combinedTitles.push(d.title);
                    combinedStrats.push(d.strat);
                });
                
                const metricsHtml = scenarioData.metrics.map(m => {
                    const change = totalChanges[m.id];
                    if (change === 0 || change === undefined) return '';
                    const isNegativeGood = m.id === 'financialImpact';
                    const arrow = change > 0 ? 'up' : 'down';
                    let colorClass = 'neutral';
                    if (change !== 0) {
                        colorClass = isNegativeGood ? (change < 0 ? 'positive' : 'negative') : (change > 0 ? 'positive' : 'negative');
                    }
                    return `<div class="metric-change ${colorClass}"><i class="fa-solid ${m.icon}"></i> ${m.name}: <i class="fa-solid fa-arrow-${arrow}-long"></i> ${change > 0 ? '+' : ''}${change.toLocaleString('tr-TR')}${m.unit}</div>`;
                }).join('');

                titleEl.textContent = "Aşama Değerlendirmesi";
                detailsEl.innerHTML = `
                    <div class="metric-change-summary-container">
                        <div class="metric-change-summary">${metricsHtml || '<p>Doğrudan metrik etkisi olmadı.</p>'}</div>
                    </div>
                    <div class="interactive-element" style="width: 100%; max-width: 600px; margin-top: 30px;">
                        <h4><i class="fa-solid fa-check-circle"></i> Seçimlerinizin Detayları: ${combinedTitles.join(' & ')}</h4>
                        <div class="learning-note" style="border-left-color: var(--accent-blue); margin-top: 20px;">
                            <h4>Stratejik Değerlendirme</h4>
                            <p>${combinedStrats.join('<br><br>')}</p>
                        </div>
                    </div>
                `;

                intermissionSection.style.display = 'flex';
                continueBtn.style.display = 'flex';
                continueBtn.onclick = () => {
                    intermissionSection.style.display = 'none';
                    document.getElementById('gameContainer').style.display = 'block';
                    this.state.currentTurnDecisions = [];
                    if (nextPhase) {
                        this.renderPhase(this.state.currentPhaseIndex);
                    } else {
                        this.renderFinalReport();
                    }
                };

                if (!nextPhase) {
                    continueBtn.innerHTML = '<i class="fa-solid fa-flag-checkered"></i> Raporu Görüntüle';
                }
            },

            renderFinalReport() {
                this.stopTimer();
                let totalScore = 100;
                let scoreBreakdown = { 'Başlangıç Puanı': { value: 100, class: 'score-neutral' } };

                if (this.state.d1_ignore) { totalScore -= 70; scoreBreakdown['Kritik Hata: Anomaliyi Göz Ardı Etme'] = { value: -70, class: 'score-minus' }; }
                if (this.state.d3_wireshark) { totalScore += 5; scoreBreakdown['Uzman Analizi: Wireshark Kullanımı'] = { value: 5, class: 'score-plus' }; }
                if (this.state.d4_dns_firewall || this.state.d4_ips_signature) { totalScore += 20; scoreBreakdown['Proaktif Savunma: Akıllı Engelleme'] = { value: 20, class: 'score-plus' }; }
                if (this.state.d5_sinkhole) { totalScore += 5; scoreBreakdown['İleri Seviye Taktik: DNS Sinkhole'] = { value: 15, class: 'score-plus' }; }
                if (this.state.d6_full_mitigation) { totalScore += 10; scoreBreakdown['Stratejik Vizyon: Kalıcı Güçlendirme'] = { value: 10, class: 'score-plus' }; }
                if (this.score.dataIntegrity < 70) { totalScore -= 25; scoreBreakdown['Yüksek Veri Sızıntısı'] = { value: -25, class: 'score-minus' }; }
                
                totalScore = Math.round(Math.max(0, Math.min(100, totalScore)));

                let badgeInfo = {};
                if (this.state.d1_ignore) { badgeInfo = { text: 'KRİTİK HATA', color: 'var(--accent-red)' }; }
                else if (totalScore >= 90) { badgeInfo = { text: 'AĞ USTASI', color: 'var(--accent-green)' }; }
                else if (totalScore >= 85) { badgeInfo = { text: 'ETKİN SAVUNMA', color: 'var(--accent-blue)' }; }
                else if (totalScore >= 50) { badgeInfo = { text: 'YETERLİ MÜDAHALE', color: 'var(--accent-yellow)' }; }
                else { badgeInfo = { text: 'GELİŞTİRİLMELİ', color: '#ff5555' }; }
                
                const metricsHtml = scenarioData.metrics.map(m => {
                    const value = this.score[m.id];
                    return `<div class="metric-card">
                                <div class="icon" style="color:${m.color}"><i class="fa-solid ${m.icon}"></i></div>
                                <div class="label">${m.name}</div>
                                <div class="value">${m.unit === '₺' ? '₺' : ''}${typeof value === 'number' ? value.toLocaleString('tr-TR') : value}${m.unit !== '₺' ? m.unit : ''}</div>
                            </div>`;
                }).join('');

                const timelineHtml = this.state.decisionHistory.map(d => `<li class="${d.impact.toLowerCase()}"><span class="decision-title">${d.title}</span></li>`).join('');
                const breakdownHtml = Object.entries(scoreBreakdown).map(([key, item]) => `<li class="${item.class}"><span>${key}</span><span class="score-value">${item.value > 0 ? '+' : ''}${item.value} Puan</span></li>`).join('');

                let debriefHTML = '';
                if (totalScore >= 90) { debriefHTML = `<p><strong>Mükemmel Performans!</strong> En ufak bir anormallikten yola çıkarak gelişmiş bir tehdidi ortaya çıkardınız. Doğru araçları metodik bir şekilde kullandınız ve en önemlisi, sadece anlık tehdidi değil, saldırganın tekniğini hedef alan proaktif ve kalıcı çözümler ürettiniz. Bu, kıdemli bir Ağ Güvenlik Mühendisi'nin sergilemesi gereken vizyon ve yetenektir.</p>`; }
                else if (totalScore >= 70) { debriefHTML = `<p><strong>Etkili Müdahale:</strong> Zorlu bir tehdidi doğru adımlarla ve kanıt toplayarak başarılı bir şekilde yönettiniz. Veri sızıntısını büyük ölçüde durdurdunuz ve ağın güvenliğini sağladınız. Genel olarak krizi yetkin bir şekilde kontrol altına aldınız.</p>`; }
                else { debriefHTML = `<p><strong>Öğrenim Fırsatı:</strong> Tehdidi yönettiniz ancak müdahale sürecinde daha hızlı veya etkili olabilecek bazı adımları atlamış olabilirsiniz. Bu simülasyon, derinlemesine paket analizi ve proaktif savunma stratejilerinin ne kadar kritik olduğunu gösteren önemli bir deneyim oldu.</p>`; }
                if (this.state.d1_ignore) { debriefHTML = `<p><strong>Kritik Hata:</strong> Simülasyonun başında uyarıyı göz ardı etmeniz, saldırganlara değerli zaman kazandırdı ve veri sızıntısının boyutunu artırdı. Bu, özellikle kritik varlıklardan gelen en küçük uyarıların bile neden hafife alınmaması gerektiğini gösteren önemli bir derstir.</p>`; }
                
                const finalHtml = `
                <div class="container">
                    <div id="finalSection" class="section" style="display: flex; flex-direction: column; align-items: center;">
                        <h2><i class="fa-solid fa-chart-line"></i> Kriz Sonrası Değerlendirme Raporu</h2>
                        <p>Simülasyon tamamlandı. Kriz yönetimi performansınızın detaylı dökümü aşağıdadır.</p>
                        <div id="performance-badge-container"><span id="performance-badge" style="background-color: ${badgeInfo.color};">${badgeInfo.text}</span></div>
                        <div class=final-metrics">
                             <div class="metric-card"><div class="icon" style="color:var(--accent-yellow)"><i class="fa-solid fa-star"></i></div><div class="label">Nihai Puan</div><div class="value">${totalScore}/100</div></div>
                             ${metricsHtml}
                        </div>
                        <div class="post-crisis-layout">
                            <div class="event-timeline"><h3><i class="fa-solid fa-timeline"></i> Karar Zaman Tüneli</h3><ul id="decision-timeline-list">${timelineHtml}</ul></div>
                            <div class="strategic-debrief">
                                <h3><i class="fa-solid fa-lightbulb"></i> Stratejik Değerlendirme</h3><div id="strategic-debrief-content">${debriefHTML}</div>
                                <h3 style="margin-top: 20px;"><i class="fa-solid fa-calculator"></i> Puan Dökümü</h3><ul id="score-breakdown">${breakdownHtml}</ul>
                            </div>
                        </div>
                        <div class="decision-buttons" style="margin-top: 40px; display:flex; gap:12px; flex-wrap:wrap; justify-content:center;">
                            <button class="btn btn-start" onclick="location.reload()"><i class="fa-solid fa-arrow-rotate-right"></i> Simülasyonu Yeniden Başlat</button>
                        </div>
                    </div>
                </div>`;
                this.render(finalHtml);
            },
            
            updateStatusBar() {
                scenarioData.metrics.forEach(m => {
                    if (this.elements.statusBar[m.id]) {
                        const value = this.score[m.id];
                        this.elements.statusBar[m.id].textContent = `${m.unit === '₺' ? '₺' : ''}${typeof value === 'number' ? value.toLocaleString('tr-TR') : value}${m.unit !== '₺' ? m.unit : ''}`;
                    }
                });
            },

            startTimer() {
                if (this.timer.running) return;
                this.timer.running = true;
                this.updateTimerUI();
                this.timer.intervalId = setInterval(() => {
                    this.timer.remaining--;
                    this.updateTimerUI();
                    if (this.timer.remaining <= 0) {
                        this.stopTimer();
                        this.renderFinalReport();
                    }
                }, 1000);
            },
            stopTimer() {
                clearInterval(this.timer.intervalId);
                this.timer.running = false;
            },
            updateTimerUI() {
                if (!this.elements.statusBar.remaining) return;
                const m = String(Math.floor(this.timer.remaining / 60)).padStart(2, '0');
                const s = String(this.timer.remaining % 60).padStart(2, '0');
                this.elements.statusBar.remaining.textContent = `${m}:${s}`;
            }
        };

        // Initialize the game when the DOM is ready
        game.init();

    })();
    </script>
</body>
</html>
