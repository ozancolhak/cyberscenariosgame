<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberScenario v9.0: Advanced DNS Tunneling Crisis Simulation</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Orbitron:wght@700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/dracula.min.css">
    <style>
        :root {
            --dark-bg: #1a1a2e;
            --container-bg: #2a2a4a;
            --section-bg: #333355;
            --interactive-bg: #444466;
            --accent-blue: #8be9fd;
            --accent-purple: #bd93f9;
            --accent-pink: #ff79c6;
            --accent-green: #50fa7b;
            --accent-yellow: #f1fa8c;
            --accent-red: #ff5555;
            --text-light: #f8f8f2;
            --text-dark: #282a36;
            --shadow-light: rgba(0, 0, 0, 0.2);
            --shadow-dark: rgba(0, 0, 0, 0.5);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-light);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            line-height: 1.7;
            font-size: 0.95em;
        }

        .container {
            background-color: var(--container-bg);
            border-radius: 12px;
            box-shadow: 0 10px 30px var(--shadow-dark);
            padding: 20px;
            max-width: 950px;
            width: 100%;
            margin: 40px 0;
            animation: fadeIn 0.8s ease-out;
        }

        @media (min-width: 768px) {
            .container {
                padding: 40px;
            }
        }

        .centered-page {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            min-height: 60vh;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.4em;
            color: var(--accent-blue);
            margin-bottom: 25px;
            text-shadow: 2px 2px 5px var(--shadow-dark);
        }

        h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.9em;
            color: var(--accent-blue);
            border-bottom: 2px solid var(--interactive-bg);
            padding-bottom: 15px;
            margin-bottom: 30px;
            text-align: left;
        }

        h3 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5em;
            color: var(--accent-purple);
            margin-top: 25px;
            margin-bottom: 15px;
            text-align: left;
        }

        h4 {
            font-size: 1.1em;
            color: var(--accent-yellow);
            text-align: left;
            margin-top: 0;
            border-bottom: 1px solid var(--interactive-bg);
            padding-bottom: 10px;
        }

        p,
        .code-block code {
            font-size: 1em;
            margin-bottom: 15px;
        }

        .section {
            display: none;
            padding: 20px;
            background-color: var(--section-bg);
            border-radius: 8px;
            margin-top: 25px;
            animation: fadeIn 0.7s ease-out;
        }

        @media (min-width: 768px) {
            .section {
                padding: 30px;
            }
        }

        .interactive-element {
            background-color: var(--interactive-bg);
            border-radius: 8px;
            padding: 25px;
            margin-top: 30px;
            box-shadow: 0 5px 15px var(--shadow-light);
        }

        .decision-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 25px;
        }

        .btn {
            background-color: #6272a4;
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1em;
            transition: all 0.3s ease;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 15px;
            font-weight: 700;
            box-shadow: 0 2px 8px var(--shadow-light);
        }

        .btn:hover {
            background-color: #7a8ab9;
            transform: translateY(-3px);
            box-shadow: 0 6px 15px var(--shadow-dark);
        }

        .btn:disabled {
            background-color: #555 !important;
            color: #999 !important;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
            opacity: 0.7;
        }

        .btn .btn-text {
            flex-grow: 1;
        }

        .btn small {
            display: block;
            font-size: 0.85em;
            opacity: 0.8;
            margin-top: 5px;
            font-weight: 400;
            color: var(--accent-blue);
        }

        .btn-start,
        .btn-continue {
            font-size: 1.3em;
            font-weight: bold;
            text-align: center;
            background-color: var(--accent-green);
            color: var(--text-dark);
            justify-content: center;
            margin-top: 40px;
            padding: 18px 30px;
        }

        .btn.critical {
            background-color: var(--accent-pink);
        }

        .btn.critical:hover {
            background-color: #ff6e87;
        }

        #intermissionSection .metric-change-summary-container {
            background-color: var(--section-bg);
            border-radius: 8px;
            padding: 25px;
            margin-top: 0;
            box-shadow: 0 5px 15px var(--shadow-light);
            width: 100%;
            max-width: 600px;
        }

        #intermissionSection .metric-change-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        #intermissionSection .metric-change {
            font-size: 1.1em;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 15px;
            border-radius: 5px;
            background-color: var(--interactive-bg);
            box-shadow: inset 0 1px 5px rgba(0, 0, 0, 0.2);
            justify-content: center;
        }

        .metric-change .positive {
            color: var(--accent-green);
        }

        .metric-change .negative {
            color: var(--accent-red);
        }

        .metric-change .neutral {
            color: var(--accent-blue);
        }

        .intro-info-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 30px;
            margin-top: 30px;
            width: 100%;
            max-width: 800px;
            text-align: left;
        }

        @media (min-width: 768px) {
            .intro-info-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .intro-roles-container,
        .intro-metrics-container {
            background-color: var(--section-bg);
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 5px 15px var(--shadow-light);
            border: 1px solid var(--interactive-bg);
        }

        .intro-roles-container h3,
        .intro-metrics-container h3 {
            margin-top: 0;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--interactive-bg);
            color: var(--accent-purple);
            text-align: center;
        }

        .intro-roles-container ul,
        .intro-metrics-container ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .intro-roles-container li,
        .intro-metrics-container li {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
            padding: 10px 0;
            border-bottom: 1px dashed var(--interactive-bg);
            font-size: 1.05em;
        }

        .intro-roles-container li:last-child,
        .intro-metrics-container li:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }

        .intro-roles-container li .icon,
        .intro-metrics-container li .icon {
            font-size: 1.8em;
            color: var(--accent-blue);
            flex-shrink: 0;
            width: 35px;
            text-align: center;
        }

        .intro-roles-container li strong {
            color: var(--accent-yellow);
        }

        .intro-roles-container li small {
            display: block;
            font-size: 0.9em;
            color: var(--text-light);
            opacity: 0.8;
            margin-top: 3px;
        }

        #statusBar {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 15px;
            background-color: var(--text-dark);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            border: 1px solid #6272a4;
            box-shadow: 0 4px 12px var(--shadow-dark);
        }

        #statusBar .metric {
            text-align: center;
            font-size: 0.9em;
            flex: 1;
            min-width: 100px;
        }

        #statusBar .metric .value {
            font-size: 1.3em;
            font-weight: bold;
            color: var(--accent-yellow);
            margin-top: 5px;
        }

        .final-metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-top: 30px;
            width: 100%;
            max-width: 850px;
        }

        .metric-card {
            background-color: var(--section-bg);
            padding: 25px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid var(--interactive-bg);
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px var(--shadow-light);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 160px;
        }

        .metric-card:hover {
            transform: scale(1.03);
            border-color: var(--accent-blue);
            box-shadow: 0 6px 20px var(--shadow-dark);
        }

        .metric-card .icon {
            font-size: 2.8em;
            color: var(--accent-blue);
            margin-bottom: 12px;
        }

        .metric-card .label {
            font-size: 1.1em;
            margin-bottom: 8px;
            color: var(--text-light);
        }

        .metric-card .value {
            font-size: 2em;
            font-weight: bold;
            color: var(--accent-yellow);
        }

        .code-block {
            background-color: var(--text-dark);
            border: 1px solid #6272a4;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
            white-space: pre-wrap;
            word-break: break-all;
            font-family: 'Consolas', monospace;
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .learning-note {
            background-color: var(--text-dark);
            border-left: 5px solid var(--accent-blue);
            padding: 20px;
            border-radius: 8px;
            margin-top: 30px;
            font-style: italic;
            opacity: 0.9;
        }

        .scenario-image {
            width: 100%;
            max-width: 600px;
            margin: 25px auto;
            display: block;
            border-radius: 8px;
            border: 1px solid var(--interactive-bg);
            box-shadow: 0 4px 15px var(--shadow-dark);
        }

        #finalSection {
            text-align: center;
        }

        #performance-badge-container {
            margin: 25px 0;
        }

        #performance-badge {
            padding: 15px 35px;
            font-size: 2em;
            font-weight: bold;
            border-radius: 50px;
            display: inline-block;
            color: var(--text-dark);
            box-shadow: 0 5px 20px var(--shadow-dark);
            transition: transform 0.3s ease;
        }

        #performance-badge:hover {
            transform: scale(1.08);
        }

        .post-crisis-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 30px;
            text-align: left;
            margin-top: 40px;
            width: 100%;
        }

        @media (min-width: 800px) {
            .post-crisis-layout {
                grid-template-columns: 1fr 1fr;
            }
        }

        .event-timeline,
        .strategic-debrief {
            background-color: var(--interactive-bg);
            padding: 25px;
            border-radius: 8px;
            border: 1px solid var(--section-bg);
            margin-top: 20px;
            box-shadow: 0 4px 15px var(--shadow-light);
        }

        .event-timeline h3,
        .strategic-debrief h3 {
            margin-top: 0;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--section-bg);
            color: var(--accent-blue);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .event-timeline ul {
            list-style-type: none;
            padding-left: 0;
            margin: 15px 0 0 0;
        }

        .event-timeline li {
            position: relative;
            padding: 5px 0 15px 35px;
            border-left: 2px solid var(--section-bg);
            font-size: 0.95em;
        }

        .event-timeline li:last-child {
            border-left: none;
        }

        .event-timeline li::before {
            content: '\f00c';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            color: var(--accent-green);
            position: absolute;
            left: -12px;
            top: 5px;
            background-color: var(--dark-bg);
            width: 22px;
            height: 22px;
            border-radius: 50%;
            text-align: center;
            line-height: 22px;
            font-size: 0.8em;
            border: 2px solid var(--section-bg);
        }

        .event-timeline li.negative::before {
            content: '\f00d';
            color: var(--accent-red);
        }

        .event-timeline li.neutral::before {
            content: '\f05a';
            color: var(--accent-blue);
        }

        .event-timeline li .decision-title {
            font-weight: bold;
            color: var(--accent-purple);
            display: block;
            margin-bottom: 4px;
        }

        #strategic-debrief-content p {
            font-size: 1.1em;
            margin-bottom: 15px;
        }

        #score-breakdown {
            list-style: none;
            padding: 0;
            margin-top: 15px;
            text-align: left;
        }

        #score-breakdown li {
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 1.05em;
            display: flex;
            justify-content: space-between;
        }

        #score-breakdown .score-plus {
            background-color: rgba(80, 250, 123, 0.1);
            border-left: 3px solid var(--accent-green);
        }

        #score-breakdown .score-minus {
            background-color: rgba(255, 85, 85, 0.1);
            border-left: 3px solid var(--accent-red);
        }

        #score-breakdown .score-neutral {
            background-color: rgba(139, 233, 253, 0.1);
            border-left: 3px solid var(--accent-blue);
        }

        #score-breakdown .score-value {
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div id="app-container">
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script>
        // IIFE (Immediately Invoked Function Expression) to avoid polluting the global scope
        (function () {
            // =================================================================================
            // SCENARIO DATA
            // All text and game logic parameters are stored here for easy editing.
            // =================================================================================
            const scenarioData = {
                title: "Advanced DNS Tunneling Simulation",
                icon: "fa-satellite-dish",
                introText: "Greetings, Network Security Engineer. Your task is to uncover a sneaky data leak detected in the infrastructure of CORESEC Technology. Attackers are using the DNS protocol as a tunnel from the most valuable database server to bypass standard security layers. This is a crisis requiring deep packet and protocol analysis beyond simple log analysis. Your decisions will determine the protection of the company's most valuable assets.",
                roles: [
                    { name: "Your Role: Network Security Engineer", desc: "You are responsible for analyzing network infrastructure, protocols, and traffic flow to detect and block stealthy threats.", icon: "fa-user-ninja" },
                    { name: "Threat Intelligence (CTI) Analyst", desc: "Provides intelligence on external threat actors, TTPs, and IoCs.", icon: "fa-user-secret" },
                    { name: "SOC Manager", desc: "Ensures overall coordination of security operations and manages resources.", icon: "fa-user-shield" }
                ],
                metrics: [
                    { id: "dataIntegrity", name: "Data Integrity", desc: "Rate of sensitive database data leaked.", startValue: 100, unit: "%", icon: "fa-database", color: "var(--accent-green)" },
                    { id: "financialImpact", name: "Financial Impact", desc: "Financial burden of the incident on the company.", startValue: 0, unit: "$", icon: "fa-hand-holding-dollar", color: "var(--accent-red)" },
                    { id: "networkPerformance", name: "Network Performance", desc: "Stability and speed of network infrastructure.", startValue: 100, unit: "", icon: "fa-ethernet", color: "var(--accent-yellow)" },
                    { id: "reputation", name: "Corporate Reputation", desc: "Your company's image in the public and sector.", startValue: 100, unit: "", icon: "fa-building-shield", color: "var(--accent-blue)" }
                ],
                timer: 300, // 6 minutes
                phases: [
                    {
                        id: 'phase1_triage',
                        title: "Phase 1: Anomaly Detection",
                        description: "Starting a quiet week, you receive a routine alert from your network performance monitoring tool (NPM) Nagios about a slight increase in average DNS resolution time for the critical database server `DB-PROD-01`. Is this a minor performance issue that can be ignored, or the first whisper of a deeper problem?",
                        image: "anomali.png",
                        maxChoices: 1,
                        decisions: [
                            { id: 'd1_investigate', title: "Investigate Performance Alert", smallText: "Check basic traffic metrics and server logs to understand the cause of DNS latency.", strat: "Every anomaly is a potential threat. Verifying even a performance alert from a critical asset is the first step of proactive security.", changes: { financialImpact: 1000, networkPerformance: -2 }, impact: 'Positive' },
                            { id: 'd1_ignore', title: "Ignore Warning", smallText: "Assume this is temporary network congestion and mark the alert as 'low priority'.", strat: "Ignoring small signals gives sophisticated and sneaky attackers the most valuable gift: time. Even the smallest anomalies sometimes hide the biggest threats.", changes: { financialImpact: 50000, dataIntegrity: -15, reputation: -5 }, impact: 'Negative' }
                        ]
                    },
                    {
                        id: 'phase2_datagathering',
                        title: "Phase 2: Data Gathering",
                        description: "Your initial investigation shows this is more than simple latency. There appears to be suspicious traffic flow from `DB-PROD-01` to the internet. Now you need to gather more evidence to understand what is happening.",
                        image: "data.png",
                        maxChoices: 2,
                        decisions: [
                            { id: 'd2_netflow', title: "NetFlow/IPFIX Traffic Analysis", smallText: "Verify the volume and destination of UDP/53 traffic originating from `DB-PROD-01` by analyzing traffic flow data.", strat: "NetFlow shows the blood flow of the network. It matches the 'big picture' and is the first step to detecting abnormal communication channels.", changes: { financialImpact: 2000 }, impact: 'Positive' },
                            { id: 'd2_zeek', title: "Examine Zeek (Bro) Logs", smallText: "Search for protocol-level details of the anomaly by examining `dns.log` and `conn.log` files generated by Zeek.", strat: "Zeek provides rich protocol metadata beyond standard logs. This is invaluable for detecting 'normal-looking abnormal' traffic.", changes: { financialImpact: 4000 }, impact: 'Positive' },
                            { id: 'd2_firewall_logs', title: "Filter Firewall Logs", smallText: "Analyze the targeted domains and request frequency by filtering all DNS requests originating from `DB-PROD-01` in NGFW logs.", strat: "Firewall logs are the gatekeepers of the network. Seeing who enters and exits sets the direction of the investigation.", changes: { financialImpact: 1000, networkPerformance: -1 }, impact: 'Neutral' },
                            { id: 'd2_pcap', title: "Instant Packet Capture (PCAP)", smallText: "Configure mirroring (SPAN) on the switch port connected to the server and collect data for raw packet analysis with `tcpdump`.", strat: "The most definitive proof is the raw packet itself. Everything else is interpretation; PCAP is the truth itself.", changes: { financialImpact: 5000, networkPerformance: -3 }, impact: 'Positive' }
                        ]
                    },
                    {
                        id: 'phase3_analysis',
                        title: "Phase 3: In-Depth Analysis",
                        description: "The data you collected shows `DB-PROD-01` consistently querying a suspicious domain like `*.c2-apt41.com` with meaningless subdomains. If you collected PCAP data, now is the time to look inside the packet.",
                        image: "wireshark.png",
                        maxChoices: 1,
                        decisions: [
                            { id: 'd3_wireshark', title: "Analyze PCAP with Wireshark", smallText: "Decipher the content of DNS queries at the protocol level by opening captured packets in Wireshark.", strat: "Wireshark is the network engineer's microscope. Protocol dissection is the most powerful method to reveal non-standard behaviors and hidden channels.", changes: { financialImpact: 3000, dataIntegrity: -15 }, impact: 'Positive' },
                            { id: 'd3_cti', title: "Request IoC Check from CTI Team", smallText: "Query the connection of the suspicious domain (`*.c2-apt41.com`) with known threat actors by forwarding it to the CTI team.", strat: "When you find an IoC, CTI databases allow you to understand the context of this indicator (which actor, which campaign), revealing the severity of the threat.", changes: { financialImpact: 1000, reputation: -2 }, impact: 'Positive' }
                        ]
                    },
                    {
                        id: 'phase4_containment',
                        title: "Phase 4: Containment and Blocking",
                        description: "Your analysis is definitive: An active data leak is occurring via DNS Tunneling. Attackers are using the DNS protocol as a shield to steal information from the database. Every minute, more data is lost. You must stop this leak immediately.",
                        image: "firewall.png",
                        maxChoices: 1,
                        decisions: [
                            { id: 'd4_block_domain', title: "Block Domain on NGFW", smallText: "As a quick solution, block all traffic to `*.c2-apt41.com` on the NGFW.", strat: "Simple domain blocking is just a small speed bump for sophisticated attackers. A more resilient defense requires focusing on the tactic itself.", changes: { financialImpact: 5000, dataIntegrity: +5, networkPerformance: -5 }, impact: 'Neutral' },
                            { id: 'd4_dns_firewall', title: "Write Behavioral Rule on DNS Firewall", smallText: "Create a policy targeting tunneling behavior (abnormal query types/lengths) at the DNS security layer.", strat: "Creating behavioral and pattern-based rules is much more effective than reactive IoC blocking. It targets the technique (TTP), not the attacker's tool.", changes: { financialImpact: 25000, dataIntegrity: +25, reputation: +10 }, impact: 'Positive' },
                            { id: 'd4_ips_signature', title: "Develop Custom Signature for IPS", smallText: "Write a custom signature for the network IPS specific to the packet structure you detected and instantly block all similar traffic.", strat: "Custom IPS signatures form one of the most effective defense layers against organization-specific threats. This is the shift from reactive defense to proactive security.", changes: { financialImpact: 15000, dataIntegrity: +15, networkPerformance: -3 }, impact: 'Positive' }
                        ]
                    },
                    {
                        id: 'phase5_eradication',
                        title: "Phase 5: Eradication and Verification",
                        description: "You successfully implemented the initial blocking. However, a professional engineer leaves nothing to chance. You must ensure your intervention really worked and that there are no other remnants of the attacker on the network or a backdoor on the `DB-PROD-01` server. The attacker might still be watching you.",
                        image: "server.png",
                        maxChoices: 1,
                        decisions: [
                            { id: 'd5_monitor', title: "Monitor and Verify Traffic Flow", smallText: "Confirm the anomaly has completely stopped by monitoring DNS and other traffic logs after blocking.", strat: "Don't assume the job is done after applying a block. Always verify. Attackers often try alternative routes when they realize they are blocked.", changes: { financialImpact: 5000, networkPerformance: -1 }, impact: 'Positive' },
                            { id: 'd5_sinkhole', title: "Gather Threat Intel with DNS Sinkholing", smallText: "Instead of blocking the malicious domain, redirect traffic to an analysis server to gather more information about the attacker's TTPs.", strat: "DNS Sinkholing is one of the most advanced steps in moving from reactive defense to proactive intelligence gathering. Gathering information about the attacker is as valuable as blocking them.", changes: { financialImpact: 20000, reputation: +5, dataIntegrity: +5 }, impact: 'Positive' },
                            { id: 'd5_isolate_host', title: "Completely Isolate the Server from Network", smallText: "Remove the affected server from the network to reset the risk and hand it over to the Incident Response team for forensic analysis.", strat: "Total isolation is the safest eradication method but has a huge impact on business continuity. The balance between risk and benefit must be carefully evaluated.", changes: { financialImpact: 50000, networkPerformance: -20, dataIntegrity: +10 }, impact: 'Negative' }
                        ]
                    },
                    {
                        id: 'phase6_post_incident',
                        title: "Phase 6: Post-Incident and Reporting",
                        description: "The threat is completely under control. Now, reporting why this incident happened and proposing permanent steps to prevent similar incidents in the future is one of your most important responsibilities as an engineer. Management wants to be sure this incident won't repeat.",
                        image: "report.png",
                        maxChoices: 1,
                        decisions: [
                            { id: 'd6_report', title: "Root Cause Analysis and Reporting", smallText: "Prepare a detailed RCA report including all findings, steps taken, and results, and present it to management.", strat: "A good intervention ends with good reporting. Documenting what you did, why you did it, and the results is essential for both the learning process and corporate responsibility.", changes: { financialImpact: 1000, reputation: +5 }, impact: 'Positive' },
                            { id: 'd6_full_mitigation', title: "Permanent Solution and Network Hardening Recommendations", smallText: "Propose a project to increase DNS auditing across the network and tighten Egress Filtering rules.", strat: "Every crisis is a learning opportunity. Not just bandaging the wound after the incident, but recommending permanent improvements to prevent similar future incidents is the most important duty of a senior engineer.", changes: { financialImpact: 30000, dataIntegrity: +5, reputation: +2 }, impact: 'Positive' }
                        ]
                    }
                ]
            };

            // =================================================================================
            // GAME ENGINE
            // This part runs the simulation based on the scenario data above.
            // =================================================================================
            const game = {
                score: {},
                state: {},
                elements: {},
                timer: {},

                init() {
                    this.elements.appContainer = document.getElementById('app-container');

                    scenarioData.metrics.forEach(m => {
                        this.score[m.id] = m.startValue;
                    });

                    this.state = {
                        currentPhaseIndex: 0,
                        decisionHistory: [],
                        currentTurnDecisions: [],
                        totalScore: null
                    };

                    this.timer = {
                        total: scenarioData.timer,
                        remaining: scenarioData.timer,
                        intervalId: null,
                        running: false
                    };

                    this.renderIntro();
                },

                render(html) {
                    this.elements.appContainer.innerHTML = html;
                },

                renderIntro() {
                    const rolesHtml = scenarioData.roles.map(r => `<li><span class="icon"><i class="fa-solid ${r.icon}"></i></span><div><strong>${r.name}</strong> <small>${r.desc}</small></div></li>`).join('');
                    const metricsHtml = scenarioData.metrics.map(m => `<li><span class="icon" style="color: ${m.color};"><i class="fa-solid ${m.icon}"></i></span><div><strong>${m.name}</strong> <small>${m.desc} (Start: ${m.startValue}${m.unit})</small></div></li>`).join('');

                    const introHtml = `
                    <div class="container">
                        <div id="introSection" class="centered-page">
                            <h1><i class="fa-solid ${scenarioData.icon}"></i> ${scenarioData.title}</h1>
                            <p style="max-width: 700px;">${scenarioData.introText}</p>
                            <img src="network.png" alt="Network traffic analysis themed image" class="scenario-image">
                            <div class="intro-info-grid">
                                <div class="intro-roles-container"><h3><i class="fa-solid fa-people-arrows"></i> Simulation Roles</h3><ul>${rolesHtml}</ul></div>
                                <div class="intro-metrics-container"><h3><i class="fa-solid fa-chart-line"></i> Key Metrics</h3><ul>${metricsHtml}</ul></div>
                            </div>
                            <button class="btn btn-start" id="startButton"><i class="fa-solid fa-play"></i> Start Simulation</button>
                        </div>
                    </div>`;
                    this.render(introHtml);
                    document.getElementById('startButton').addEventListener('click', () => this.startGame());
                },

                startGame() {
                    const statusBarMetricsHtml = scenarioData.metrics.map(m => `
                    <div class="metric">
                        <span><i class="fa-solid ${m.icon}"></i> ${m.name}</span>
                        <div class="value" id="status-${m.id}">${m.unit === '$' ? '$' : ''}${m.startValue.toLocaleString('en-US')}${m.unit !== '$' ? m.unit : ''}</div>
                    </div>`).join('');

                    const gameHtml = `
                    <div class="container">
                        <div id="gameContainer">
                            <div id="statusBar">
                                ${statusBarMetricsHtml}
                                <div class="metric" id="status-timer">
                                    <span><i class="fa-solid fa-stopwatch"></i> Time Remaining</span>
                                    <div class="value" id="status-remaining">--:--</div>
                                </div>
                            </div>
                            <div id="game-content"></div>
                        </div>
                        <div id="intermissionSection" class="centered-page" style="display: none;">
                            <h2 id="intermissionTitle"></h2>
                            <div id="intermissionDetails"></div>
                            <button class="btn btn-continue" id="continueButton" style="margin-top: 30px; display: none;"><i class="fa-solid fa-forward"></i> Continue</button>
                        </div>
                    </div>`;
                    this.render(gameHtml);

                    this.elements.statusBar = {};
                    scenarioData.metrics.forEach(m => {
                        this.elements.statusBar[m.id] = document.getElementById(`status-${m.id}`);
                    });
                    this.elements.statusBar.remaining = document.getElementById('status-remaining');
                    this.elements.gameContent = document.getElementById('game-content');

                    this.startTimer();
                    this.renderPhase(this.state.currentPhaseIndex);
                },

                renderPhase(phaseIndex) {
                    const phase = scenarioData.phases[phaseIndex];
                    if (!phase) {
                        this.renderFinalReport();
                        return;
                    }

                    const decisionsHtml = phase.decisions.map(d => {
                        const is_disabled = this.state[d.id] || false;
                        let dependencyMet = true;
                        let dependencyText = d.smallText;

                        if (d.id === 'd3_wireshark' && !this.state.d2_pcap) {
                            dependencyMet = false;
                            dependencyText = 'You must start packet capture (PCAP) first.';
                        }

                        return `<button class="btn ${d.impact === 'Negative' ? 'critical' : ''}" data-decision-id="${d.id}" ${is_disabled || !dependencyMet ? 'disabled' : ''}>
                                <i class="fa-solid fa-chevron-right"></i>
                                <div class="btn-text">${d.title}<small>${dependencyText}</small></div>
                            </button>`;
                    }).join('');

                    const phaseHtml = `
                    <div class="section" style="display: block;" data-max-selections="${phase.maxChoices}">
                        <h2>${phase.title}</h2>
                        <p>${phase.description}</p>
                        ${phase.image ? `<img src="${phase.image}" alt="${phase.title}" class="scenario-image">` : ''}
                        <div class="interactive-element">
                            <h4>What will you do? (${phase.maxChoices} Choices)</h4>
                            <div class="decision-buttons">${decisionsHtml}</div>
                        </div>
                    </div>`;
                    this.elements.gameContent.innerHTML = phaseHtml;
                    this.elements.gameContent.querySelector('.decision-buttons').addEventListener('click', (e) => {
                        const button = e.target.closest('.btn[data-decision-id]');
                        if (button && !button.disabled) {
                            this.handleDecision(button.dataset.decisionId);
                        }
                    });
                },

                handleDecision(decisionId) {
                    const phase = scenarioData.phases[this.state.currentPhaseIndex];
                    const decision = phase.decisions.find(d => d.id === decisionId);

                    if (!decision) return;

                    document.querySelector(`[data-decision-id="${decisionId}"]`).disabled = true;
                    this.state.currentTurnDecisions.push(decision);
                    this.state[decision.id] = true;
                    this.state.decisionHistory.push(decision);

                    for (const key in decision.changes) {
                        if (this.score.hasOwnProperty(key)) {
                            this.score[key] += decision.changes[key];
                        }
                    }
                    this.updateStatusBar();

                    if (this.state.currentTurnDecisions.length >= phase.maxChoices) {
                        this.renderIntermission();
                    }
                },

                renderIntermission() {
                    const decisionsMade = this.state.currentTurnDecisions;
                    this.state.currentPhaseIndex++;
                    const nextPhase = scenarioData.phases[this.state.currentPhaseIndex];

                    document.getElementById('gameContainer').style.display = 'none';
                    const intermissionSection = document.getElementById('intermissionSection');
                    const titleEl = document.getElementById('intermissionTitle');
                    const detailsEl = document.getElementById('intermissionDetails');
                    const continueBtn = document.getElementById('continueButton');

                    let totalChanges = {};
                    scenarioData.metrics.forEach(m => totalChanges[m.id] = 0);

                    let combinedTitles = [], combinedStrats = [];
                    decisionsMade.forEach(d => {
                        for (const key in d.changes) { totalChanges[key] += d.changes[key]; }
                        combinedTitles.push(d.title);
                        combinedStrats.push(d.strat);
                    });

                    const metricsHtml = scenarioData.metrics.map(m => {
                        const change = totalChanges[m.id];
                        if (change === 0 || change === undefined) return '';
                        const isNegativeGood = m.id === 'financialImpact';
                        const arrow = change > 0 ? 'up' : 'down';
                        let colorClass = 'neutral';
                        if (change !== 0) {
                            colorClass = isNegativeGood ? (change < 0 ? 'positive' : 'negative') : (change > 0 ? 'positive' : 'negative');
                        }
                        return `<div class="metric-change ${colorClass}"><i class="fa-solid ${m.icon}"></i> ${m.name}: <i class="fa-solid fa-arrow-${arrow}-long"></i> ${change > 0 ? '+' : ''}${change.toLocaleString('en-US')}${m.unit}</div>`;
                    }).join('');

                    titleEl.textContent = "Phase Assessment";
                    detailsEl.innerHTML = `
                    <div class="metric-change-summary-container">
                        <div class="metric-change-summary">${metricsHtml || '<p>No direct impact on metrics.</p>'}</div>
                    </div>
                    <div class="interactive-element" style="width: 100%; max-width: 600px; margin-top: 30px;">
                        <h4><i class="fa-solid fa-check-circle"></i> Details of Your Choices: ${combinedTitles.join(' & ')}</h4>
                        <div class="learning-note" style="border-left-color: var(--accent-blue); margin-top: 20px;">
                            <h4>Strategic Assessment</h4>
                            <p>${combinedStrats.join('<br><br>')}</p>
                        </div>
                    </div>
                `;

                    intermissionSection.style.display = 'flex';
                    continueBtn.style.display = 'flex';
                    continueBtn.onclick = () => {
                        intermissionSection.style.display = 'none';
                        document.getElementById('gameContainer').style.display = 'block';
                        this.state.currentTurnDecisions = [];
                        if (nextPhase) {
                            this.renderPhase(this.state.currentPhaseIndex);
                        } else {
                            this.renderFinalReport();
                        }
                    };

                    if (!nextPhase) {
                        continueBtn.innerHTML = '<i class="fa-solid fa-flag-checkered"></i> View Report';
                    }
                },

                renderFinalReport() {
                    this.stopTimer();
                    // --- STANDARD SCORING SYSTEM (V2) ---
                    let totalScore = 50;
                    let scoreBreakdown = { 'Initial Score': { value: 50, class: 'score-neutral' } };

                    // 1. Decision Based Scoring (+10 / 0 / -10)
                    let decisionScore = 0;
                    this.state.decisionHistory.forEach(d => {
                        if (d.impact === 'Positive') { decisionScore += 10; }
                        else if (d.impact === 'Negative') { decisionScore -= 10; }
                    });

                    if (decisionScore !== 0) {
                        totalScore += decisionScore;
                        scoreBreakdown['Decision Quality'] = {
                            value: decisionScore,
                            class: decisionScore > 0 ? 'score-plus' : 'score-minus'
                        };
                    }

                    // 2. Metric Based Bonuses
                    // Data Integrity
                    if (this.score.dataIntegrity >= 90) {
                        totalScore += 10;
                        scoreBreakdown['High Data Integrity'] = { value: 10, class: 'score-plus' };
                    } else if (this.score.dataIntegrity < 50) {
                        totalScore -= 10;
                        scoreBreakdown['Data Leak Penalty'] = { value: -10, class: 'score-minus' };
                    }

                    // Corporate Reputation
                    if (this.score.reputation >= 90) {
                        totalScore += 10;
                        scoreBreakdown['High Reputation'] = { value: 10, class: 'score-plus' };
                    } else if (this.score.reputation < 50) {
                        totalScore -= 10;
                        scoreBreakdown['Reputation Loss Penalty'] = { value: -10, class: 'score-minus' };
                    }

                    // Network Performance
                    if (this.score.networkPerformance >= 90) {
                        totalScore += 5;
                        scoreBreakdown['High Network Performance'] = { value: 5, class: 'score-plus' };
                    }

                    // 3. Strategic Bonuses
                    if (this.state.d1_ignore) { totalScore -= 20; scoreBreakdown['Critical Error: Ignoring Anomaly'] = { value: -20, class: 'score-minus' }; }
                    if (this.state.d5_sinkhole) { totalScore += 5; scoreBreakdown['Advanced Tactic: DNS Sinkhole'] = { value: 5, class: 'score-plus' }; }
                    if (this.state.d6_full_mitigation) { totalScore += 5; scoreBreakdown['Strategic Vision: Permanent Hardening'] = { value: 5, class: 'score-plus' }; }

                    // 4. Time Bonus
                    if (this.timer.remaining >= 150) {
                        totalScore += 5;
                        scoreBreakdown['Rapid Response Bonus'] = { value: 5, class: 'score-plus' };
                    }

                    totalScore = Math.round(Math.max(0, Math.min(100, totalScore)));
                    // --- END OF SCORING SYSTEM ---

                    let badgeInfo = {};
                    if (this.state.d1_ignore) { badgeInfo = { text: 'CRITICAL ERROR', color: 'var(--accent-red)' }; }
                    else if (totalScore >= 90) { badgeInfo = { text: 'NETWORK MASTER', color: 'var(--accent-green)' }; }
                    else if (totalScore >= 85) { badgeInfo = { text: 'EFFECTIVE DEFENSE', color: 'var(--accent-blue)' }; }
                    else if (totalScore >= 50) { badgeInfo = { text: 'SUFFICIENT RESPONSE', color: 'var(--accent-yellow)' }; }
                    else { badgeInfo = { text: 'NEEDS IMPROVEMENT', color: '#ff5555' }; }

                    const metricsHtml = scenarioData.metrics.map(m => {
                        const value = this.score[m.id];
                        return `<div class="metric-card">
                                <div class="icon" style="color:${m.color}"><i class="fa-solid ${m.icon}"></i></div>
                                <div class="label">${m.name}</div>
                                <div class="value">${m.unit === '$' ? '$' : ''}${typeof value === 'number' ? value.toLocaleString('en-US') : value}${m.unit !== '$' ? m.unit : ''}</div>
                            </div>`;
                    }).join('');

                    const timelineHtml = this.state.decisionHistory.map(d => `<li class="${d.impact.toLowerCase()}"><span class="decision-title">${d.title}</span></li>`).join('');
                    const breakdownHtml = Object.entries(scoreBreakdown).map(([key, item]) => `<li class="${item.class}"><span>${key}</span><span class="score-value">${item.value > 0 ? '+' : ''}${item.value} Points</span></li>`).join('');

                    let debriefHTML = '';
                    if (totalScore >= 90) { debriefHTML = `<p><strong>Excellent Performance!</strong> You uncovered a sophisticated threat from the slightest anomaly. You used the right tools methodically and most importantly, produced proactive and permanent solutions targeting not just the immediate threat but the attacker's technique. This is the vision and skill a senior Network Security Engineer should exhibit.</p>`; }
                    else if (totalScore >= 70) { debriefHTML = `<p><strong>Effective Intervention:</strong> You successfully managed a challenging threat with the right steps and evidence gathering. You largely stopped the data leak and ensured network security. Overall, you controlled the crisis competently.</p>`; }
                    else { debriefHTML = `<p><strong>Learning Opportunity:</strong> You managed the threat but may have skipped some steps that could have been faster or more effective. This simulation was an important experience showing how critical in-depth packet analysis and proactive defense strategies are.</p>`; }
                    if (this.state.d1_ignore) { debriefHTML = `<p><strong>Critical Error:</strong> Ignoring the warning at the beginning of the simulation gave attackers valuable time and increased the size of the data leak. This is an important lesson showing why even the smallest alerts from critical assets should not be underestimated.</p>`; }

                    const finalHtml = `
                <div class="container">
                    <div id="finalSection" class="section" style="display: flex; flex-direction: column; align-items: center;">
                        <h2><i class="fa-solid fa-chart-line"></i> Post-Crisis Assessment Report</h2>
                        <p>Simulation complete. Below is a detailed breakdown of your crisis management performance.</p>
                        <div id="performance-badge-container"><span id="performance-badge" style="background-color: ${badgeInfo.color};">${badgeInfo.text}</span></div>
                        <div class=final-metrics">
                             <div class="metric-card"><div class="icon" style="color:var(--accent-yellow)"><i class="fa-solid fa-star"></i></div><div class="label">Final Score</div><div class="value">${totalScore}/100</div></div>
                             ${metricsHtml}
                        </div>
                        <div class="post-crisis-layout">
                            <div class="event-timeline"><h3><i class="fa-solid fa-timeline"></i> Decision Timeline</h3><ul id="decision-timeline-list">${timelineHtml}</ul></div>
                            <div class="strategic-debrief">
                                <h3><i class="fa-solid fa-lightbulb"></i> Strategic Debrief</h3><div id="strategic-debrief-content">${debriefHTML}</div>
                                <h3 style="margin-top: 20px;"><i class="fa-solid fa-calculator"></i> Score Breakdown</h3><ul id="score-breakdown">${breakdownHtml}</ul>
                            </div>
                        </div>
                        <div class="decision-buttons" style="margin-top: 40px; display:flex; gap:12px; flex-wrap:wrap; justify-content:center;">
                            <button class="btn btn-start" onclick="location.reload()"><i class="fa-solid fa-arrow-rotate-right"></i> Restart Simulation</button>
                        </div>
                    </div>
                </div>`;
                    this.render(finalHtml);
                },

                updateStatusBar() {
                    scenarioData.metrics.forEach(m => {
                        if (this.elements.statusBar[m.id]) {
                            const value = this.score[m.id];
                            this.elements.statusBar[m.id].textContent = `${m.unit === '$' ? '$' : ''}${typeof value === 'number' ? value.toLocaleString('en-US') : value}${m.unit !== '$' ? m.unit : ''}`;
                        }
                    });
                },

                startTimer() {
                    if (this.timer.running) return;
                    this.timer.running = true;
                    this.updateTimerUI();
                    this.timer.intervalId = setInterval(() => {
                        this.timer.remaining--;
                        this.updateTimerUI();
                        if (this.timer.remaining <= 0) {
                            this.stopTimer();
                            this.renderFinalReport();
                        }
                    }, 1000);
                },
                stopTimer() {
                    clearInterval(this.timer.intervalId);
                    this.timer.running = false;
                },
                updateTimerUI() {
                    if (!this.elements.statusBar.remaining) return;
                    const m = String(Math.floor(this.timer.remaining / 60)).padStart(2, '0');
                    const s = String(this.timer.remaining % 60).padStart(2, '0');
                    this.elements.statusBar.remaining.textContent = `${m}:${s}`;
                }
            };

            // Initialize the game when the DOM is ready
            game.init();

        })();
    </script>
    <script src="../global-scenario.js"></script>
</body>

</html>
